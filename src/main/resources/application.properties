# Aplicacion
spring.application.name=jamap
server.port=8090
server.servlet.context-path=/api

# Perfil por defecto en desarrollo local (carga application-dev.properties si existe)
spring.profiles.default=dev

# JPA / Hibernate (buenas practicas base)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de dominio Ja'Map
app.dedup.radio-metros=50
app.cors.allowed-origins=*
